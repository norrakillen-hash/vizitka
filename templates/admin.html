<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="card">
        <header>
            <h1>Входящие сообщения</h1>
            <p class="role">Всего: {{ messages|length }}</p>
        </header>

        <p><a href="/">← На главную</a></p>

        {% if not messages %}
            <p class="tagline">Пока никто не написал.</p>
        {% endif %}

        {% for m in messages %}
            <div class="project">
                <h3>#{{ m.id }} — {{ m.name }} &lt;{{ m.email }}&gt;</h3>
                <p class="tagline">{{ m.created_at }}</p>
                <p>{{ m.text }}</p>
            </div>
        {% endfor %}
    </main>
</body>
</html>
